<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puppy Park — משחק Flexbox</title>
  <meta name="description" content="Puppy Park — משחק אינטראקטיבי ללימוד CSS Flexbox. סדרו את הכלבים במלונות שלהם.">

  <!-- Heebo is self-hosted (see @font-face in style.css) — no external requests. -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">
    <!-- ============ Header ============ -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <!-- small paw mark -->
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
            <circle cx="6" cy="10" r="2.1"/>
            <circle cx="10.5" cy="6.5" r="2.1"/>
            <circle cx="15" cy="6.5" r="2.1"/>
            <circle cx="19" cy="10" r="2.1"/>
            <path d="M12.5 11.5c2.4 0 4.4 1.9 4.4 4.1 0 1.7-1.3 2.6-3 2.6-.8 0-1-.3-1.4-.3s-.6.3-1.4.3c-1.7 0-3-.9-3-2.6 0-2.2 2-4.1 4.4-4.1z"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1>Puppy Park</h1>
          <p>למדו CSS Flexbox — שלב אחר שלב</p>
        </div>
      </div>

      <div class="header-right">
        <button type="button" class="icon-btn" id="mute-btn" aria-label="הפעלת/כיבוי סאונד" aria-pressed="false"></button>
        <div class="progress-readout">
          <span id="progress-count" class="progress-count">0 / 7</span>
          <span class="progress-label">שלבים שהושלמו</span>
        </div>
      </div>
    </header>

    <!-- ============ Level strip (which level am I on) ============ -->
    <nav class="level-strip" id="level-strip" aria-label="בחירת שלב"></nav>

    <!-- ============ Main game area ============ -->
    <main class="game">
      <!-- Left: the board -->
      <section class="board-side" aria-label="לוח המשחק">
        <div class="board-scale">
          <div class="board" id="board">
            <!-- Decorative park scenery (behind the play layers, non-interactive). -->
            <div class="board-scene" aria-hidden="true">
              <svg class="scene-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <!-- sun -->
                <circle cx="88" cy="12" r="8" fill="#f6e6a4" opacity=".6"/>
                <!-- soft clouds -->
                <g fill="#ffffff" opacity=".55">
                  <ellipse cx="20" cy="15" rx="8" ry="3.4"/>
                  <ellipse cx="26" cy="14" rx="5" ry="3"/>
                </g>
                <!-- grassy mound -->
                <path d="M-2 89 Q28 81 54 88 T102 87 V103 H-2 Z" fill="#d4e8cd" opacity=".85"/>
                <!-- bushes -->
                <g fill="#c2dcab">
                  <circle cx="11" cy="91" r="7"/>
                  <circle cx="18" cy="93" r="5.5"/>
                  <circle cx="87" cy="92" r="7"/>
                  <circle cx="80" cy="94" r="5"/>
                </g>
                <!-- little flowers -->
                <g opacity=".8">
                  <circle cx="42" cy="95" r="1.6" fill="#e7bcd4"/>
                  <circle cx="61" cy="96" r="1.6" fill="#f4d59a"/>
                  <circle cx="52" cy="97" r="1.4" fill="#e7bcd4"/>
                </g>
              </svg>
            </div>
            <!-- Target layer: kennels, laid out with the SOLUTION values. Non-interactive. -->
            <div class="layer layer-target" id="target-layer" aria-hidden="true"></div>
            <!-- Player layer: dogs, driven live by the dropdowns. -->
            <div class="layer layer-player" id="player-layer"></div>
          </div>
        </div>
      </section>

      <!-- Right: instructions + controls -->
      <section class="panel" aria-label="לוח בקרה">
        <div class="level-heading">
          <h2 class="level-title" id="level-title"></h2>
        </div>

        <!-- Always-visible instruction for the current level -->
        <p class="instruction" id="instruction"></p>

        <!-- The CSS property inputs, built per level. The player types the value. -->
        <div class="controls" id="controls"></div>

        <!-- Actions + hint, pinned to the bottom of the panel -->
        <div class="panel-bottom">
          <!-- Hint box, toggled by the hint button -->
          <div class="hint-box hidden" id="hint-box" role="note"></div>

          <div class="actions">
            <button type="button" class="btn btn-primary" id="check-btn">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
              בדוק פתרון
            </button>
            <button type="button" class="btn btn-ghost" id="reset-btn">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
              איפוס שלב
            </button>
            <button type="button" class="btn btn-ghost" id="hint-btn" aria-expanded="false" aria-controls="hint-box">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/></svg>
              רמז
            </button>
            <button type="button" class="btn btn-primary btn-next hidden" id="next-btn">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
              לשלב הבא
            </button>
          </div>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>נבנה בעזרת HTML, CSS ו-JavaScript טהורים · ללא ספריות חיצוניות · Flexbox בלבד</p>
    </footer>
  </div>

  <!-- ============ Success / error popup toast ============ -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- ============ Win screen (all levels done) ============ -->
  <div class="win-overlay hidden" id="win-overlay" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <div class="win-card">
      <div class="win-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4zM7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3"/>
        </svg>
      </div>
      <h2 id="win-title">כל הכבוד! סיימתם את Puppy Park</h2>
      <p>כל 7 השלבים הושלמו — אתם שולטים ב-Flexbox!</p>
      <button type="button" class="btn btn-primary" id="restart-btn">שחקו שוב</button>
    </div>
  </div>

  <!-- Data layer first, then the engine. Plain scripts, no modules (per spec). -->
  <script src="js/levels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
